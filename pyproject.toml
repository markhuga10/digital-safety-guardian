[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-safety-guardian"
version = "0.3.0"
description = "A security analysis tool for detecting social engineering, suspicious URLs, and attack patterns"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "pydantic",
    "httpx2"
]

[tool.setuptools]
py-modules = [
    "cli",
    "main",
    "detector",
    "risk_engine",
    "combined_risk_engine",
    "url_detector",
    "url_risk_engine",
    "recommendation_engine",
    "trusted_domains",
    "attack_pattern_engine",
    "models"
]

[project.scripts]
dsg = "cli:main"
